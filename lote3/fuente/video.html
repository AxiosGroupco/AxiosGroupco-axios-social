<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Video: Ley de Rescate Económico</title>
<style>
  @font-face { font-family: "Poppins"; src: url("../../web/assets/fonts/poppins-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Poppins"; src: url("../../web/assets/fonts/poppins-600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Poppins"; src: url("../../web/assets/fonts/poppins-700.woff2") format("woff2"); font-weight: 700; }
  :root { --teal: #4fc3cf; --teal-d: #13808a; --rojo: #ff5c6c; --verde: #5be3a1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1920px; overflow: hidden; font-family: "Poppins", sans-serif; color: #fff;
         background: linear-gradient(180deg, #0b4374 0%, #0a3156 42%, #061727 70%, #040d17 100%); }
  #aro { position: absolute; left: 90px; width: 900px; top: 1610px; height: 210px; border-radius: 50%;
         background: radial-gradient(closest-side, rgba(19,52,82,.95), rgba(10,30,50,.9) 70%, transparent 72%);
         box-shadow: 0 0 0 5px rgba(127,227,245,.85), 0 0 40px 6px rgba(79,195,207,.5); }
  #barra { position: absolute; top: 0; left: 0; height: 10px; width: 0; background: linear-gradient(90deg, #c8102e, var(--teal)); z-index: 9; }
  .logo { position: absolute; left: 50px; top: 60px; background: #fff; border-radius: 20px; padding: 12px 20px; z-index: 5; }
  .logo img { height: 46px; display: block; }
  #aviso { position: absolute; right: 50px; top: 70px; z-index: 5; background: rgba(200,16,46,.92); border-radius: 30px;
           padding: 12px 26px; font-size: 26px; font-weight: 700; letter-spacing: .06em; }
  #titulo { position: absolute; left: 60px; right: 60px; top: 190px; font-size: 64px; font-weight: 700; line-height: 1.08;
            letter-spacing: -0.015em; z-index: 4; text-shadow: 0 6px 20px rgba(0,0,0,.35); }
  #titulo .t { color: var(--teal); }
  #tarjeta { position: absolute; left: 60px; right: 60px; top: 370px; min-height: 380px; z-index: 4;
             background: rgba(4,18,32,.72); border: 3px solid rgba(79,195,207,.35); border-radius: 36px; padding: 30px 36px;
             box-shadow: 0 30px 80px rgba(0,0,0,.35); display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .fila { display: flex; justify-content: space-between; align-items: center; gap: 20px; font-size: 32px; padding: 12px 20px;
          background: rgba(255,255,255,.06); border-radius: 20px; }
  .fila b { font-weight: 600; color: #cfe3f2; }
  .fila span { font-weight: 700; text-align: right; }
  .fila em { font-style: normal; color: var(--teal); }
  .fila.verde span { color: var(--verde); } .fila.roja span { color: var(--rojo); }
  .grande { font-size: 84px; font-weight: 700; line-height: 1.1; text-align: center; }
  .sub { font-size: 34px; color: #b9cbe0; text-align: center; }
  .rojo { color: var(--rojo); }
  .alerta { margin-top: 8px; text-align: center; font-size: 38px; font-weight: 700; color: #fff; background: #c8102e; border-radius: 20px; padding: 16px; }
  .tabla { display: flex; flex-direction: column; gap: 10px; }
  .th, .tr { display: grid; grid-template-columns: 1.6fr 0.7fr 0.9fr; gap: 12px; font-size: 34px; padding: 14px 20px; border-radius: 16px; }
  .th { color: #9fb6cc; font-size: 26px; letter-spacing: .08em; text-transform: uppercase; }
  .tr { background: rgba(255,255,255,.07); font-weight: 700; font-size: 44px; }
  .tr span:nth-child(n+2) { text-align: center; }
  .ejemplo { font-size: 32px; line-height: 1.45; text-align: center; color: #d7e6f3; background: rgba(79,195,207,.12); border-radius: 18px; padding: 18px; }
  .ejemplo b { color: #fff; }
  .cta { background: #fff; color: #0b1f33; border-radius: 30px; padding: 30px; text-align: center; }
  .cta .k { font-size: 28px; font-weight: 600; letter-spacing: .14em; color: #64748b; }
  .cta .kw { display: inline-block; margin-top: 10px; background: var(--teal-d); color: #fff; font-size: 70px; font-weight: 700; border-radius: 18px; padding: 2px 28px; }
  .cta .num { font-size: 70px; font-weight: 700; }
  #subs { position: absolute; left: 50px; right: 50px; top: 905px; z-index: 6; text-align: center; font-size: 54px; font-weight: 700; line-height: 1.2;
          text-shadow: 0 4px 0 rgba(0,0,0,.55), 0 0 18px rgba(0,0,0,.5); }
  #subs .w { opacity: .55; } #subs .w.on { opacity: 1; color: #ffe066; } #subs .w.ya { opacity: 1; }
  .sprite { position: absolute; display: none; }
  #narrador .sprite { left: -130px; top: 800px; width: 1340px; height: 1340px; }
  .reac { position: absolute; z-index: 3; opacity: 0; }
  .reac img { width: 820px; height: 820px; display: block; }
  .burbuja { position: absolute; top: 120px; left: 330px; background: #fff; color: #0b1f33; font-size: 46px; font-weight: 700;
             border-radius: 30px; padding: 14px 30px; white-space: nowrap; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .fuente { position: absolute; right: 52px; top: 134px; font-size: 21px; color: #a9c0d6; text-align: right; z-index: 7; }
</style>
</head>
<body>
<div id="aro"></div>
<div id="barra"></div>
<div class="logo"><img src="../../web/assets/img/logo-axios.png" alt=""></div>
<div id="aviso">PROYECTO · AÚN NO ES LEY</div>
<div id="titulo"></div>
<div id="tarjeta"></div>
<div id="subs"></div>

<div id="reac_socio2" class="reac" style="left:-170px; top:1060px"><img class="sprite" data-s="cerrada" src="../sprites/socio2_cerrada.png"><img class="sprite" data-s="abierta" src="../sprites/socio2_abierta.png"><div class="burbuja" style="left:420px"></div></div>
<div id="reac_socio3" class="reac" style="left:430px; top:1060px"><img class="sprite" data-s="cerrada" src="../sprites/socio3_cerrada.png"><img class="sprite" data-s="abierta" src="../sprites/socio3_abierta.png"><div class="burbuja" style="left:250px"></div></div>
<div id="narrador" style="position:absolute; inset:0; z-index:2"></div>
<div class="fuente">Fuente: Actualícese · texto radicado PL 477/2026</div>

<script>
  const POSES = ['explica', 'senala'], ESTADOS = ['cerrada', 'media', 'abierta', 'parpadeo'];
  const nar = document.getElementById('narrador');
  for (const p of POSES) for (const e of ESTADOS) {
    const im = document.createElement('img'); im.className = 'sprite'; im.dataset.k = p + '_' + e;
    im.src = `../sprites/socio1_${p}_${e}.png`; nar.appendChild(im);
  }
  const clamp = x => Math.max(0, Math.min(1, x));
  const ease = x => 1 - Math.pow(1 - x, 3);
  let E, T, escenaActual = -1;

  window.setup = (escenas, tiempos) => { E = escenas; T = tiempos; window.DURATION = T.duracion; };

  function escenaEn(t) {
    let i = 0;
    for (let k = 0; k < T.escenas.length; k++) if (t >= T.escenas[k].inicio - 0.15) i = k;
    return i;
  }

  window.render = t => {
    document.getElementById('barra').style.width = (100 * t / T.duracion) + '%';
    const i = escenaEn(t), es = E.escenas[i], te = T.escenas[i];
    if (i !== escenaActual) {
      document.getElementById('titulo').innerHTML = es.titulo;
      document.getElementById('tarjeta').innerHTML = es.html;
      escenaActual = i;
    }
    const k = ease(clamp((t - te.inicio + 0.15) / 0.4));
    for (const id of ['titulo', 'tarjeta']) {
      const el = document.getElementById(id);
      el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 50}px)`;
    }

    // Boca según la energía de la voz; parpadeo cada ~3,7 s cuando no habla
    const f = Math.min(T.boca.length - 1, Math.round(t * 30));
    const v = T.boca[f] || 0;
    let estado = v < 0.12 ? 'cerrada' : v < 0.45 ? 'media' : 'abierta';
    if (estado === 'cerrada' && (t % 3.7) < 0.12) estado = 'parpadeo';
    const clave = es.pose + '_' + estado;
    const rebote = Math.sin(t * 2.2) * 6 + v * 10;
    for (const im of nar.children) {
      const on = im.dataset.k === clave;
      im.style.display = on ? 'block' : 'none';
      if (on) im.style.transform = `translateY(${-rebote}px)`;
    }

    // Reacciones de los otros socios
    for (const s of ['socio2', 'socio3']) {
      const box = document.getElementById('reac_' + s);
      const r = es.reaccion;
      const activo = r && (r.socio === s || r.socio === 'todos');
      let a = 0;
      if (activo) {
        const t0 = te.inicio + (te.fin - te.inicio) * r.desde;
        a = ease(clamp((t - t0) / 0.35)) * (1 - clamp((t - te.fin + 0.2) / 0.3));
        box.querySelector('.burbuja').textContent = r.texto;
        box.querySelector('.burbuja').style.display = r.texto ? 'block' : 'none';
      }
      box.style.opacity = a;
      box.style.transform = `translateY(${(1 - a) * 160}px) scale(${0.9 + 0.1 * a})`;
      const abierta = activo && a > 0.5 && ((t * 2) % 1) < 0.5;
      for (const im of box.querySelectorAll('img')) im.style.display = (im.dataset.s === (abierta ? 'abierta' : 'cerrada')) ? 'block' : 'none';
    }

    // Subtítulos: grupos de hasta 5 palabras con la palabra actual resaltada
    const P = T.palabras;
    let j = -1;
    for (let n = 0; n < P.length; n++) if (P[n].ini <= t) j = n;
    const subs = document.getElementById('subs');
    if (j < 0 || t > P[j].fin + 0.6) { subs.innerHTML = ''; return; }
    const g0 = j - (j % 5), grupo = P.slice(g0, g0 + 5);
    subs.innerHTML = grupo.map((p, n) => `<span class="w ${g0 + n === j ? 'on' : (g0 + n < j ? 'ya' : '')}">${p.w}</span>`).join(' ');
  };
  window.READY = true;
</script>
</body>
</html>
