# Publica la carpeta web/ en la rama gh-pages (GitHub Pages) cada vez
# que cambia en main. Sin acciones de terceros: solo git y GITHUB_TOKEN.
name: Publicar sitio web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/sitio-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitio-web
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar web/ en gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd web
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar sitio desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
