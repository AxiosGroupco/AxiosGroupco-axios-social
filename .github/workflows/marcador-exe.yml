# Compila marcador/ en un único MarcadorAxios.exe para Windows (con adb incluido)
# y lo deja como artefacto descargable de la ejecución.
name: Compilar Marcador (.exe)

on:
  push:
    paths:
      - "marcador/**"
      - ".github/workflows/marcador-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marcador-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: marcador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias y pruebas
        run: |
          pip install -r requirements.txt pyinstaller pytest
          python -m pytest -q tests

      - name: Descargar adb (Android SDK Platform-Tools)
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath .

      - name: Compilar
        run: >
          pyinstaller --onefile --noconsole --name MarcadorAxios
          --icon recursos/icono.ico
          --add-data "recursos/icono.ico;recursos"
          --add-data "recursos/icono_44.png;recursos"
          --add-data "recursos/icono_96.png;recursos"
          --add-binary "platform-tools/adb.exe;adb"
          --add-binary "platform-tools/AdbWinApi.dll;adb"
          --add-binary "platform-tools/AdbWinUsbApi.dll;adb"
          marcador.py

      - name: Prueba de humo del .exe
        run: |
          $p = Start-Process -FilePath dist\MarcadorAxios.exe -ArgumentList "--autotest" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "El .exe no cerró a tiempo" }
          if ($p.ExitCode -ne 0) { throw "El .exe terminó con código $($p.ExitCode)" }
          exit 0

      - name: Armar paquete
        run: Copy-Item GUIA_CELULAR.md dist\

      - uses: actions/upload-artifact@v4
        with:
          name: MarcadorAxios
          path: |
            marcador/dist/MarcadorAxios.exe
            marcador/dist/GUIA_CELULAR.md
